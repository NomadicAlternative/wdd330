[build]
  command = "npm run build"
  publish = "dist"

# Redirect specific routes to their HTML files (for SPA-like behavior)
[[redirects]]
  from = "/checkout/success"
  to = "/checkout/success.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout/index.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart/index.html"
  status = 200

[[redirects]]
  from = "/product_listing"
  to = "/product_listing/index.html"
  status = 200

[[redirects]]
  from = "/product_pages"
  to = "/product_pages/index.html"
  status = 200
